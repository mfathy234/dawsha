name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run package -- --linux --x64 --publish never
      - name: Upload Linux test packages
        uses: actions/upload-artifact@v7
        with:
          name: Dawsha-${{ github.event.pull_request.number || github.run_number }}-linux-x64-test-build
          path: |
            release/Dawsha-*-linux-x64.AppImage
            release/Dawsha-*-linux-x64.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the macOS app without signing
        run: npm run package -- --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
      - name: Upload the Apple Silicon test build
        uses: actions/upload-artifact@v7
        with:
          name: Dawsha-${{ github.event.pull_request.number || github.run_number }}-mac-arm64-test-build
          path: |
            release/Dawsha-*-mac-arm64.dmg
            release/Dawsha-*-mac-arm64.zip
            release/Dawsha-*-mac-arm64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - name: Unit tests
        run: npx vitest run
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep temp files under the runner temp folder
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Install browser for website tests
        run: npx playwright install chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/dawsha-e2e-*/quit.log
          if-no-files-found: ignore
          retention-days: 7
