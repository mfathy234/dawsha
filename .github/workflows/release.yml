name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Package
        run: npm run package -- --publish never
      - name: Check the update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version: ${version}$" release/latest.yml
          grep -q "Dawsha-Setup-${version}.exe" release/latest.yml
          test -f "release/Dawsha-Setup-${version}.exe.blockmap"
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "${version}" build/release-notes.md --optional
          if [ -s build/release-notes.md ]; then
            notes=(--notes-file build/release-notes.md)
          else
            echo "No CHANGELOG.md section for ${version}; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "release/Dawsha-Setup-${version}.exe" \
            "release/Dawsha-Setup-${version}.exe.blockmap" \
            "release/Dawsha-Portable-${version}.exe" \
            "release/latest.yml" \
            --title "Dawsha ${version}" \
            "${notes[@]}" \
            --verify-tag
  release-linux:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run package -- --linux --x64 --publish never
      - name: Check Linux update manifest and packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version: ${version}$" release/latest-linux.yml
          grep -q "Dawsha-${version}-linux-x86_64.AppImage" release/latest-linux.yml
          test -f "release/Dawsha-${version}-linux-x86_64.AppImage"
          test -f "release/Dawsha-${version}-linux-amd64.deb"
      - name: Upload Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "release/Dawsha-${version}-linux-x86_64.AppImage" \
            "release/Dawsha-${version}-linux-amd64.deb" \
            "release/latest-linux.yml" \
            --clobber
  release-macos:
    needs: release
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package signed and notarized macOS release when credentials are configured
        shell: bash
        run: |
          credentials=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
          configured=0
          missing=0
          for value in "${credentials[@]}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); else missing=$((missing + 1)); fi
          done
          if [ "$configured" -eq 5 ]; then
            npm run package -- --publish never
          elif [ "$configured" -eq 0 ]; then
            npm run package -- --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
          else
            echo "Configure all five macOS signing and notarization secrets, or leave all five empty."
            exit 1
          fi
      - name: Check macOS update manifest and packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "Dawsha-${version}-mac-arm64.zip" release/latest-mac.yml
          test -f "release/Dawsha-${version}-mac-arm64.dmg"
          test -f "release/Dawsha-${version}-mac-arm64.zip"
          test -f "release/Dawsha-${version}-mac-arm64.zip.blockmap"
      - name: Upload macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "release/Dawsha-${version}-mac-arm64.dmg" \
            "release/Dawsha-${version}-mac-arm64.zip" \
            "release/Dawsha-${version}-mac-arm64.zip.blockmap" \
            "release/latest-mac.yml" \
            --clobber
