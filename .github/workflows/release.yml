name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Package
        run: npm run package -- --publish never
      - name: Check the update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version: ${version}$" release/latest.yml
          grep -q "Dawsha-Setup-${version}.exe" release/latest.yml
          test -f "release/Dawsha-Setup-${version}.exe.blockmap"
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "${version}" build/release-notes.md --optional
          if [ -s build/release-notes.md ]; then
            notes=(--notes-file build/release-notes.md)
          else
            echo "No CHANGELOG.md section for ${version}; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "release/Dawsha-Setup-${version}.exe" \
            "release/Dawsha-Setup-${version}.exe.blockmap" \
            "release/Dawsha-Portable-${version}.exe" \
            "release/latest.yml" \
            --title "Dawsha ${version}" \
            "${notes[@]}" \
            --verify-tag
