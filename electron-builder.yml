appId: io.github.mfathy234.dawsha
productName: Dawsha
directories:
  output: release
files:
  - out/**
  - '!out/renderer-private/**'
  - package.json
  - build/icon.png
  # typescript is used at runtime only through lib/tsserver.js (language server) and lib/typescript.js (symbol worker)
  - '!node_modules/typescript/bin/**'
  - '!node_modules/typescript/lib/{cs,de,es,fr,it,ja,ko,pl,pt-br,ru,tr,zh-cn,zh-tw}/**'
  - '!node_modules/typescript/lib/{_tsc.js,tsc.js,tsserverlibrary.js,tsserverlibrary.d.ts,typescript.d.ts}'
  # packages that only the renderer uses; vite already bundles them into out/renderer
  - '!node_modules/{@codemirror,@lezer,@fontsource}/**'
  - '!node_modules/@xterm/{xterm,addon-fit,addon-search,addon-web-links,addon-webgl}/**'
  - '!node_modules/{bidi-js,qrcode-generator,@marijn,crelt,style-mod,w3c-keyname}/**'
  # node-pty: build-from-source inputs are not needed, the prebuilt binaries are used
  - '!node_modules/node-pty/{src,deps,scripts,third_party,typings,binding.gyp}/**'
  - '!node_modules/node-addon-api/**'
  # docs, maps and test folders inside runtime packages
  - '!node_modules/**/*.{map,md,markdown}'
  - '!node_modules/**/{test,tests,__tests__,example,examples,docs}/**'
extraResources:
  - from: build/dawsha-cli.cjs
    to: dawsha-cli.cjs
  # The taskbar jump list's entries use this icon file directly.
  - from: build/icon.ico
    to: dawsha.ico
electronLanguages:
  - en-US
  - ar
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/typescript/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  extraResources:
    - from: build/path-edit.ps1
      to: path-edit.ps1
  extraFiles:
    - from: build/dawsha.cmd
      to: dawsha.cmd
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  signAndEditExecutable: true
  signExecutable: false
nsis:
  artifactName: Dawsha-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: Dawsha-Portable-${version}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip
  artifactName: Dawsha-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  extraResources:
    - from: build/dawsha
      to: dawsha
linux:
  category: Development
  extraResources:
    - from: build/dawsha
      to: dawsha
  icon: build/icon.png
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: Dawsha-${version}-linux-${arch}.${ext}
  maintainer: Mohamed Fathy <mfathy234@users.noreply.github.com>
publish:
  provider: github
  owner: mfathy234
  repo: dawsha
