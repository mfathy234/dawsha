appId: io.github.mfathy234.dawsha
productName: Dawsha
directories:
  output: release
files:
  - out/**
  - '!out/renderer-private/**'
  - package.json
  - build/icon.png
extraResources:
  - from: build/dawsha-cli.cjs
    to: dawsha-cli.cjs
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  extraResources:
    - from: build/path-edit.ps1
      to: path-edit.ps1
  extraFiles:
    - from: build/dawsha.cmd
      to: dawsha.cmd
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  signAndEditExecutable: true
  signExecutable: false
nsis:
  artifactName: Dawsha-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: Dawsha-Portable-${version}.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip
  artifactName: Dawsha-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  extraResources:
    - from: build/dawsha
      to: dawsha
linux:
  category: Development
  extraResources:
    - from: build/dawsha
      to: dawsha
  icon: build/icon.png
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: Dawsha-${version}-linux-${arch}.${ext}
  maintainer: Mohamed Fathy <mfathy234@users.noreply.github.com>
publish:
  provider: github
  owner: mfathy234
  repo: dawsha
